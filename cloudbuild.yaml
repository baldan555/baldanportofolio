# Builds the site image in Google Cloud and pushes it to Artifact Registry.
#   gcloud builds submit --project PROJECT --config cloudbuild.yaml \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/web/site:TAG,_SITE_URL=https://...
# then: gcloud run deploy ... --image that tag (min instances 0). Steps are in docs/deploy-plan.md.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_SITE_URL=${_SITE_URL}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
