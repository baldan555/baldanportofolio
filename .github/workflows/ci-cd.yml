name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: gatherinsight
  REGION: asia-southeast1
  REPOSITORY: baldanproject
  SERVICE: baldanproject
  SITE_URL: https://portofolio.baldanproject.my.id
  WIF_PROVIDER: projects/1021483580038/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOY_SA: github-deployer@gatherinsight.iam.gserviceaccount.com
  TF_VERSION: 1.9.8

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Production build (type-checks and prerenders every page)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    needs: terraform-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock=false

  deploy:
    name: Build image and deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, terraform-check]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Image name
        id: img
        run: echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/site:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.image }}
          build-args: NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Roll out with Terraform
        working-directory: infra/terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -var "image=${{ steps.img.outputs.image }}"

      - name: Smoke test
        run: |
          serving=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          echo "Serving image: $serving"
          test "$serving" = "${{ steps.img.outputs.image }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            echo "GET $SITE_URL/ -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
